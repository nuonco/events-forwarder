receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 10s

exporters:
  # DataDog exporter
  datadog:
    api:
      key: ${DATADOG_API_KEY}
      site: us5.datadoghq.com
    app_key: ${DATADOG_APP_KEY}
    
  # Grafana Loki exporter
  loki:
    endpoint: ${GRAFANA_LOKI_URL}
    headers:
      X-Scope-OrgID: ${GRAFANA_LOKI_INSTANCE_ID}
    tenant_id: ${GRAFANA_LOKI_INSTANCE_ID}
    auth:
      authenticator: basicauth

extensions:
  basicauth:
    client_auth:
      username: ${GRAFANA_LOKI_INSTANCE_ID}
      password: ${GRAFANA_LOKI_TOKEN}

service:
  extensions: [basicauth]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      # To disable a platform: remove it from the exporters list
      # To add a platform: add exporter config above and include it here
      exporters: [datadog, loki]
